<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Álbum Cauã">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Álbum do Cauã - Copa 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="album-cover">
      <div class="cover-leaves">
        <div class="leaf-col left">
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
        </div>
        <div class="leaf-col right">
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
          <span class="leaf"></span><span class="leaf shift"></span>
        </div>
      </div>
      <div class="cover-inner">
        <div class="cover-top-text">OFFICIAL STICKER<br>COLLECTION</div>
        <div class="cover-26">
          <span class="digit-2">2</span>
          <span class="trophy">
            <svg viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg" aria-label="Troféu Copa do Mundo FIFA">
              <defs>
                <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff2a8"/>
                  <stop offset="35%" stop-color="#ecc34a"/>
                  <stop offset="65%" stop-color="#b58423"/>
                  <stop offset="100%" stop-color="#d9a836"/>
                </linearGradient>
                <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#c89422"/>
                  <stop offset="100%" stop-color="#8b5e15"/>
                </linearGradient>
                <radialGradient id="globe" cx="40%" cy="38%">
                  <stop offset="0%" stop-color="#fff2a8"/>
                  <stop offset="60%" stop-color="#e1b13e"/>
                  <stop offset="100%" stop-color="#8b5e15"/>
                </radialGradient>
              </defs>
              <ellipse cx="60" cy="36" rx="26" ry="28" fill="url(#globe)"/>
              <path d="M 38,32 Q 50,28 60,30 Q 72,34 82,30 M 36,42 Q 50,46 60,44 Q 72,42 84,44 M 60,12 Q 58,30 60,46 Q 62,58 60,62" stroke="#8b5e15" stroke-width="1.2" fill="none" opacity=".6"/>
              <ellipse cx="60" cy="62" rx="22" ry="4" fill="url(#goldDark)"/>
              <path d="M 38,64 Q 28,80 32,98 Q 36,114 44,128 L 50,140 L 70,140 L 76,128 Q 84,114 88,98 Q 92,80 82,64 Q 75,78 60,82 Q 45,78 38,64 Z" fill="url(#gold)" stroke="#8b5e15" stroke-width="1"/>
              <path d="M 56,80 Q 60,90 64,80 M 52,100 Q 60,108 68,100" stroke="#8b5e15" stroke-width="1" fill="none" opacity=".5"/>
              <rect x="40" y="138" width="40" height="10" rx="2" fill="url(#gold)" stroke="#8b5e15" stroke-width="1"/>
              <rect x="34" y="148" width="52" height="14" rx="2" fill="#2a3328"/>
              <rect x="34" y="148" width="52" height="3" fill="#4a5648"/>
              <ellipse cx="60" cy="164" rx="28" ry="4" fill="#1a1f1c"/>
            </svg>
          </span>
          <span class="digit-6">6</span>
        </div>
        <div class="cover-fifa">FIFA WORLD CUP 2026</div>
        <div class="cover-photo-hero">
          <img src="assets/caua.jpg" alt="Cauã" class="cover-photo-img" onerror="this.parentElement.classList.add('no-photo')">
          <div class="cover-photo-fallback">⚽</div>
        </div>
        <div class="cover-name-big">CAUÃ</div>
        <div class="cover-host-row">
          <span class="host-flag">🇺🇸</span>
          <span class="host-flag">🇨🇦</span>
          <span class="host-flag">🇲🇽</span>
        </div>
        <div class="cover-sticker-album">STICKER ALBUM · ÁLBUM DE CROMOS</div>
        <div class="cover-panini">PANINI</div>
      </div>
    </div>

    <form id="loginForm" class="login-card" autocomplete="off">
      <h1>Entrar no álbum</h1>
      <label>
        <span>Nome do colecionador</span>
        <input type="text" id="loginName" maxlength="20" placeholder="Ex: Cauã" required>
      </label>
      <label>
        <span>PIN de 4 dígitos</span>
        <input type="password" id="loginPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" required>
      </label>
      <button type="submit" class="btn-primary">Abrir álbum</button>

      <div id="loginError" class="login-error" hidden></div>

      <div class="profiles-section" id="profilesSection" hidden>
        <h2>Perfis salvos</h2>
        <div id="profilesList" class="profiles-list"></div>
      </div>

      <p class="login-hint">Cada perfil tem suas próprias figurinhas marcadas.<br>
      Primeira vez? Escolha um nome e PIN — fica salvo neste celular.</p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data/supabase-config.js?v=7"></script>
  <script src="data/countries.js?v=7"></script>
  <script src="data/stickers.js?v=7"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <script>
    const form = document.getElementById('loginForm');
    const nameInput = document.getElementById('loginName');
    const pinInput = document.getElementById('loginPin');
    const errorBox = document.getElementById('loginError');
    const profilesSection = document.getElementById('profilesSection');
    const profilesList = document.getElementById('profilesList');

    // Cliente Supabase
    let supabaseClient = null;
    try {
      if (window.SUPABASE_CONFIG && window.supabase) {
        supabaseClient = window.supabase.createClient(
          window.SUPABASE_CONFIG.url,
          window.SUPABASE_CONFIG.anonKey
        );
      }
    } catch (e) { console.warn('Supabase indisponível, modo local', e); }

    async function loadProfilesFromCloud() {
      if (!supabaseClient) return null;
      try {
        const { data, error } = await supabaseClient.from('profiles').select('name');
        if (error) throw error;
        return (data || []).map(d => d.name);
      } catch (e) {
        console.warn('Erro ao listar perfis:', e);
        return null;
      }
    }

    async function renderProfiles() {
      profilesList.innerHTML = '<div style="font-size:11px;opacity:.6">Carregando...</div>';
      const names = await loadProfilesFromCloud();
      if (!names || names.length === 0) {
        profilesSection.hidden = true;
        return;
      }
      profilesSection.hidden = false;
      profilesList.innerHTML = '';
      names.forEach(n => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'profile-chip';
        btn.innerHTML = `<span class="profile-avatar">${n.charAt(0).toUpperCase()}</span><span>${n}</span>`;
        btn.addEventListener('click', () => {
          nameInput.value = n;
          pinInput.focus();
        });
        profilesList.appendChild(btn);
      });
    }
    renderProfiles();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim();
      if (!name || !/^\d{4}$/.test(pin)) {
        errorBox.textContent = 'Preencha o nome e um PIN de 4 dígitos.';
        errorBox.hidden = false;
        return;
      }

      const submitBtn = form.querySelector('button[type=submit]');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Conectando...';
      submitBtn.disabled = true;

      try {
        if (supabaseClient) {
          // Modo nuvem (família)
          const { data: existing, error: fetchErr } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('name', name)
            .maybeSingle();

          if (fetchErr) throw fetchErr;

          if (!existing) {
            // Novo perfil - cria
            const { error: insertErr } = await supabaseClient
              .from('profiles')
              .insert({ name, pin, counts: {}, scores: {} });
            if (insertErr) throw insertErr;
          } else {
            if (existing.pin !== pin) {
              errorBox.textContent = 'PIN incorreto para este perfil.';
              errorBox.hidden = false;
              submitBtn.textContent = originalText;
              submitBtn.disabled = false;
              return;
            }
          }
          localStorage.setItem('caua_currentProfile', name);
          localStorage.setItem('caua_currentPin', pin);
          window.location.href = 'app.html';
        } else {
          // Modo local (offline / Supabase indisponível)
          const profiles = JSON.parse(localStorage.getItem('caua_profiles') || '{}');
          if (profiles[name]) {
            if (profiles[name].pin !== pin) {
              errorBox.textContent = 'PIN incorreto.';
              errorBox.hidden = false;
              submitBtn.textContent = originalText;
              submitBtn.disabled = false;
              return;
            }
          } else {
            profiles[name] = { pin };
            localStorage.setItem('caua_profiles', JSON.stringify(profiles));
          }
          localStorage.setItem('caua_currentProfile', name);
          localStorage.setItem('caua_currentPin', pin);
          window.location.href = 'app.html';
        }
      } catch (err) {
        console.error(err);
        errorBox.textContent = 'Erro: ' + (err.message || 'tente novamente');
        errorBox.hidden = false;
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
