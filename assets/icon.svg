<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fundo: gradiente quente -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="40%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f1929"/>
    </linearGradient>

    <!-- Brilho dourado principal do troféu -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5c2"/>
      <stop offset="15%" stop-color="#ffd955"/>
      <stop offset="50%" stop-color="#e8a91a"/>
      <stop offset="85%" stop-color="#a86d0c"/>
      <stop offset="100%" stop-color="#6b3f00"/>
    </linearGradient>

    <!-- Brilho lateral do troféu (highlight) -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fff8d6" stop-opacity="0"/>
    </linearGradient>

    <!-- Sombra interna pro troféu -->
    <radialGradient id="cupInner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe89a"/>
      <stop offset="70%" stop-color="#d49a2c"/>
      <stop offset="100%" stop-color="#8b5e15"/>
    </radialGradient>

    <!-- Glow dourado atrás do troféu -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd955" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd955" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo escuro arredondado -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Estrelas decorativas no fundo -->
  <g fill="#ffd955" opacity="0.35">
    <circle cx="80" cy="100" r="3"/>
    <circle cx="430" cy="80" r="2.5"/>
    <circle cx="60" cy="380" r="2"/>
    <circle cx="450" cy="420" r="3"/>
    <circle cx="380" cy="180" r="2"/>
    <circle cx="130" cy="450" r="2.5"/>
    <circle cx="100" cy="220" r="2"/>
    <circle cx="440" cy="280" r="2"/>
  </g>

  <!-- Brilho dourado de fundo -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Raios de luz atrás do troféu -->
  <g opacity="0.5" fill="#ffd955" transform="translate(256,260)">
    <polygon points="0,-180 8,-90 -8,-90" opacity="0.6"/>
    <polygon points="127,-127 71,-71 56,-90" opacity="0.4"/>
    <polygon points="-127,-127 -56,-90 -71,-71" opacity="0.4"/>
    <polygon points="170,-30 90,-12 90,-30" opacity="0.3"/>
    <polygon points="-170,-30 -90,-30 -90,-12" opacity="0.3"/>
  </g>

  <!-- TROFÉU -->
  <g transform="translate(256,256)">

    <!-- Sombra do troféu -->
    <ellipse cx="0" cy="160" rx="105" ry="10" fill="#000" opacity="0.4"/>

    <!-- Base inferior (pedestal preto) -->
    <rect x="-70" y="142" width="140" height="22" rx="4" fill="#1f1f2e"/>
    <rect x="-78" y="138" width="156" height="10" rx="3" fill="#0a0a14"/>

    <!-- Plaquinha dourada com "26" -->
    <rect x="-32" y="147" width="64" height="14" rx="2" fill="url(#gold)"/>
    <text x="0" y="159" text-anchor="middle" font-family="Arial Black,Helvetica,sans-serif" font-weight="900" font-size="13" fill="#5a3a08">2026</text>

    <!-- Base do pedestal trapezoidal -->
    <polygon points="-60,138 60,138 50,108 -50,108" fill="url(#gold)" stroke="#7a5012" stroke-width="2"/>
    <polygon points="-50,108 50,108 42,90 -42,90" fill="url(#cupInner)" stroke="#7a5012" stroke-width="1.5"/>

    <!-- Haste/tronco -->
    <rect x="-12" y="60" width="24" height="32" fill="url(#gold)" stroke="#7a5012" stroke-width="1.5"/>
    <rect x="-14" y="86" width="28" height="6" rx="2" fill="url(#gold)" stroke="#7a5012" stroke-width="1.5"/>

    <!-- Alça esquerda -->
    <path d="M -55,-20 Q -98,-15 -98,30 Q -98,62 -68,68 L -55,68"
          fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <path d="M -55,-20 Q -98,-15 -98,30 Q -98,62 -68,68 L -55,68"
          fill="none" stroke="#7a5012" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Alça direita -->
    <path d="M 55,-20 Q 98,-15 98,30 Q 98,62 68,68 L 55,68"
          fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 55,-20 Q 98,-15 98,30 Q 98,62 68,68 L 55,68"
          fill="none" stroke="#7a5012" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Copo principal -->
    <path d="M -65,-50 L 65,-50 Q 70,-50 70,-45 L 60,60 Q 55,68 45,68 L -45,68 Q -55,68 -60,60 L -70,-45 Q -70,-50 -65,-50 Z"
          fill="url(#gold)" stroke="#7a5012" stroke-width="2.5"/>

    <!-- Highlight no lado esquerdo do copo -->
    <path d="M -55,-40 L -45,-40 L -38,55 L -48,55 Z" fill="#fff8d6" opacity="0.6"/>
    <path d="M -30,-40 L -25,-40 L -22,30 L -27,30 Z" fill="#fff8d6" opacity="0.3"/>

    <!-- Borda superior do copo (lábio) -->
    <ellipse cx="0" cy="-50" rx="68" ry="8" fill="url(#gold)" stroke="#7a5012" stroke-width="2.5"/>
    <ellipse cx="0" cy="-50" rx="62" ry="5" fill="#8b5e15"/>
    <ellipse cx="0" cy="-52" rx="60" ry="3" fill="#1a1a2e"/>

    <!-- Estrela central no copo -->
    <g transform="translate(0,5)">
      <polygon points="0,-26 7,-8 26,-8 11,4 17,22 0,12 -17,22 -11,4 -26,-8 -7,-8"
               fill="#fff8d6" stroke="#7a5012" stroke-width="1.5"/>
    </g>

    <!-- Brilho de luz no copo -->
    <ellipse cx="-20" cy="-25" rx="6" ry="14" fill="#fff" opacity="0.7"/>
    <ellipse cx="-30" cy="0" rx="3" ry="20" fill="#fff" opacity="0.4"/>
  </g>
</svg>
