<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4444a"/>
      <stop offset="25%" stop-color="#f06a25"/>
      <stop offset="55%" stop-color="#f5d34c"/>
      <stop offset="80%" stop-color="#54a96d"/>
      <stop offset="100%" stop-color="#4a8ec6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="50%" stop-color="#ecc34a"/>
      <stop offset="100%" stop-color="#b58423"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <!-- Fundo gradiente arco-íris -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Bola de futebol grande centralizada -->
  <g transform="translate(256,260)">
    <circle r="180" fill="url(#ball)" stroke="#111" stroke-width="10"/>
    <!-- Pentágono central preto -->
    <polygon points="0,-70 67,-22 41,62 -41,62 -67,-22" fill="#111"/>
    <!-- Hexágonos brancos ao redor -->
    <polygon points="0,-180 50,-150 50,-90 0,-70 -50,-90 -50,-150" fill="#fff" stroke="#111" stroke-width="6"/>
    <polygon points="67,-22 130,-50 165,-10 130,30 105,-5 88,-22" fill="#fff" stroke="#111" stroke-width="6"/>
    <polygon points="-67,-22 -88,-22 -105,-5 -130,30 -165,-10 -130,-50" fill="#fff" stroke="#111" stroke-width="6"/>
    <polygon points="41,62 88,80 100,140 50,160 20,130 25,90" fill="#fff" stroke="#111" stroke-width="6"/>
    <polygon points="-41,62 -25,90 -20,130 -50,160 -100,140 -88,80" fill="#fff" stroke="#111" stroke-width="6"/>
  </g>
</svg>
